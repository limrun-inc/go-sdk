# SDK endpoint contract used by scripts/mock. Runtime-only endpoints are excluded.
# Go duration strings stay strings: Prism interprets format: duration as ISO 8601.
openapi: 3.0.3
info:
  title: Limrun SDK test contract
  version: 0.69.1
paths:
  /v1/access_tokens:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessTokenCreate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/access_tokens/{tokenId}:
    delete:
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
