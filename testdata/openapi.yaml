            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /v1/analytics:
    get:
      parameters:
        - name: from
          required: false
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          required: false
          in: query
          schema:
            type: string
            format: date-time
        - name: startedAt
          in: query
          style: deepObject
          explode: true
          schema:
            $ref: '#/components/schemas/AnalyticsTimeFilter'
        - name: stoppedAt
          in: query
          style: deepObject
          explode: true
          schema:
            $ref: '#/components/schemas/AnalyticsTimeFilter'
        - name: region
          required: false
          in: query
          schema:
            type: string
        - name: bucket
          required: false
          in: query
          schema:
            type: string
            enum:
              - hour
              - day
              - week
              - minute
            default: day
        - name: timezone
          required: false
          in: query
          schema:
            type: string
            default: America/Los_Angeles
        - name: labels
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
